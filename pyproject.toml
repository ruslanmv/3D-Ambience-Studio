[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "3d-ambience-studio"
version = "0.1.0"
description = "Ambient environment creation, optimization and publishing pipeline for 3D-Avatar-Chatbot"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "Pillow>=10.4",
  "typer>=0.12",
  "httpx>=0.27",
  "jsonschema>=4.23",
  # The Hugging Face Inference Providers client. Pinned to 1.x because that is where the
  # signatures this code uses were verified: provider routing on the constructor, `seed` on
  # text_to_image, and `target_size` on image_to_image.
  "huggingface_hub>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ambience = "ambience.cli:app"

[tool.setuptools]
package-dir = {"" = "apps/api"}

[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["apps/api/tests"]

[tool.ruff]
line-length = 110
